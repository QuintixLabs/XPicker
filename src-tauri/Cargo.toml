[package]
name = "xpicker"
version = "1.0.3"
description = "Lightweight screen color picker"
authors = ["Quintix"]
license = "GPL-3.0"
edition = "2021"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["macos-private-api", "tray-icon"] }
serde_json = "1"
xcap = "0.9.8"
arboard = { version = "3.7.0", default-features = false, features = ["wayland-data-control"] }
serde = { version = "1.0.229", features = ["derive"] }
tauri-plugin-global-shortcut = "2.4.1"
tauri-plugin-single-instance = "2.5.5"
tauri-plugin-updater = "2.14.1"
tauri-plugin-opener = "2.7.2"
tauri-plugin-autostart = "2.7.0"

# Small, fast release binary
[profile.release]
opt-level = "s"
lto = true
codegen-units = 1
panic = "abort"
strip = true

[target."cfg(windows)".dependencies]
windows = { version = "0.62.2", features = ["Data_Xml_Dom", "UI_Notifications", "Foundation"] }

[target."cfg(not(windows))".dependencies]
notify-rust = "4.18.2"
