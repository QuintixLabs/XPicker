# Builds XPicker for Windows, macOS and Linux into a DRAFT GitHub Release.
# Runs when the version in package.json changes on main (see docs/contents/03_RELEASING.md).
# Nothing reaches users until you click "Publish release", which also creates the tag.
#
# Needs one repository secret:
#   TAURI_SIGNING_PRIVATE_KEY   contents of the updater private key file
# (TAURI_SIGNING_PRIVATE_KEY_PASSWORD is only needed if the key gets a password.)
#
# The release includes latest.json, which the in-app "Check for updates" reads.

name: Release

on:
  push:
    branches: [main]
    paths: [package.json]
  workflow_dispatch:

jobs:
  release:
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: windows-latest
            args: ""
          - platform: macos-latest
            args: "--target universal-apple-darwin"
          # 24.04, not 22.04: screen capture needs PipeWire 1.0+ headers.
          - platform: ubuntu-24.04
            args: ""
    runs-on: ${{ matrix.platform }}

    steps:
      - uses: actions/checkout@v5

      - name: Linux dependencies
        if: startsWith(matrix.platform, 'ubuntu')
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev patchelf \
            libxdo-dev libxcb1-dev libxrandr-dev libdbus-1-dev libpipewire-0.3-dev libwayland-dev libegl-dev libgbm-dev

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.platform == 'macos-latest' && 'aarch64-apple-darwin,x86_64-apple-darwin' || '' }}

      - uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - run: npm ci

      - uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          tagName: v__VERSION__
          releaseName: XPicker v__VERSION__
          releaseBody: Download the installer for your system below. Existing installs update from inside the app (Settings → Check for updates).
          releaseDraft: true
          prerelease: false
          includeUpdaterJson: true
          # Signatures are already inside latest.json; no separate .sig files.
          uploadUpdaterSignatures: false
          args: ${{ matrix.args }}
