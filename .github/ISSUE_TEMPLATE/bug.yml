name: Bug Report
description: Create a report to help us improve
labels: ["bug"]

body:
  - type: checkboxes
    attributes:
      label: Already reported? *
      description: Before reporting a bug, check if it already exists in the open or closed issues.
      options:
        - label: I have searched the existing open and closed issues.
          required: true

  - type: input
    id: system
    attributes:
      label: Your system
      description: Which system and version you use. On Linux, add your desktop (like KDE or GNOME) and whether it's X11 or Wayland.
      placeholder: "Windows 11 · Ubuntu 24.04, KDE, Wayland · macOS 15"
    validations:
      required: true

  - type: input
    id: version
    attributes:
      label: XPicker version
      description: Find it at the bottom of XPicker's Settings. If it's not the latest, update first and check if the bug is still there.
      placeholder: "2.2.0"
    validations:
      required: true

  - type: textarea
    id: desc
    attributes:
      label: Describe the bug
      description: "What went wrong?"
    validations:
      required: true

  - type: textarea
    id: repro
    attributes:
      label: How to reproduce
      description: "How can someone else reproduce the issue?"
    validations:
      required: true

  - type: textarea
    id: beh
    attributes:
      label: Expected behavior
      description: "A clear and concise description of what you expected to happen."
    validations:
      required: false

  - type: textarea
    id: output
    attributes:
      label: Terminal output
      description: If you started XPicker from a terminal, paste what it printed. It often shows what went wrong.
      render: shell
    validations:
      required: false

  - type: textarea
    id: logs
    attributes:
      label: Images, Videos
      description: |
        Anything that can help. Please always ATTACH and not paste them.
    validations:
      required: false
